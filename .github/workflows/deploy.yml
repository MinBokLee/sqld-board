name: SQLD App CI/CD

on:
  push:
    branches: [ "main" ] # main 브랜치에 코드가 올라오면 자동 실행

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      # Java 17 설정 (프로젝트 버전에 맞춰 수정 가능)
      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'

      # 1. 빌드 권한 부여 및 Gradle 빌드
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build with Gradle
        run: ./gradlew clean build -x test

      # 2. Docker Hub 로그인 및 이미지 업로드
      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push Docker image
        run: |
          docker build -t ${{ secrets.DOCKER_USERNAME }}/sqld-app .
          docker push ${{ secrets.DOCKER_USERNAME }}/sqld-app

      # 3. 서버에 접속해서 배포 (SSH)
      - name: Deploy to Server
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.KEY }}
          script: |
            # 1. 기존 컨테이너가 있으면 강제로 지우기
            sudo docker rm -f sqld-app || true
            
            # 2. Docker Hub에서 최신 이미지 가져오기
            sudo docker pull ${{ secrets.DOCKER_USERNAME }}/sqld-app
            
            # 3. 컨테이너 새로 실행 (역슬래시 뒤에 공백 주의!)
            sudo docker run -d --name sqld-app \
            -p 8881:8881 \
            -e SPRING_PROFILES_ACTIVE=prod \
            -e "JASYPT_ENCRYPTOR_PASSWORD=${{ secrets.JASYPT_PASSWORD }}" \
            ${{ secrets.DOCKER_USERNAME }}/sqld-app

            # 4. 안 쓰는 예전 이미지 정리
            sudo docker image prune -f