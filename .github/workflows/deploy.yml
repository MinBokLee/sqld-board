name: SQLD App CI/CD

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # 1. 소스 체크아웃
      - name: Checkout code
        uses: actions/checkout@v3

      # 2. Java 17 설정
      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'

      # 3. Gradle 캐시
      - name: Setup Gradle Cache
        uses: gradle/gradle-build-action@v2

      # 4. gradlew 실행 권한
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # 5. Spring Boot 빌드
      - name: Build with Gradle
        run: ./gradlew clean build -x test

      # 6. Docker Hub 로그인
      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # 7. Docker 이미지 빌드 및 업로드
      - name: Build and push Docker image
        run: |
          docker build -t ${{ secrets.DOCKER_USERNAME }}/sqld-app:latest .
          docker push ${{ secrets.DOCKER_USERNAME }}/sqld-app:latest

      # 8. 서버 배포
      - name: Deploy to Server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.KEY }}
          script: |

            # 기존 컨테이너 종료 및 삭제
            sudo docker rm -f sqld-app || true

            # 최신 이미지 pull
            sudo docker pull ${{ secrets.DOCKER_USERNAME }}/sqld-app:latest

            # 새 컨테이너 실행
            sudo docker run -d \
              --name sqld-app \
              --restart unless-stopped \
              -p 8881:8881 \
              -e SPRING_PROFILES_ACTIVE=prod \
              -e JASYPT_ENCRYPTOR_PASSWORD=${{ secrets.JASYPT_PASSWORD }} \
              ${{ secrets.DOCKER_USERNAME }}/sqld-app:latest

            # 사용하지 않는 이미지 정리
            sudo docker image prune -f