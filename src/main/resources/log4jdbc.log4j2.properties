# log4jdbc-log4j2 \uC124\uC815 \uD30C\uC77C
# SQL \uB85C\uADF8\uB97C \uAC00\uB3C5\uC131 \uC788\uAC8C \uCD9C\uB825\uD558\uAE30 \uC704\uD55C \uB4DC\uB77C\uC774\uBC84 \uC2A4\uD30C\uC774(DriverSpy) \uC124\uC815\uC785\uB2C8\uB2E4.

# SQL \uB85C\uADF8\uB97C SLF4J \uB77C\uC774\uBE0C\uB7EC\uB9AC\uB97C \uD1B5\uD574 \uCD9C\uB825\uD558\uB3C4\uB85D \uC124\uC815
log4jdbc.spylogdelegator.name=net.sf.log4jdbc.log.slf4j.Slf4jSpyLogDelegator

# \uC0AC\uC6A9\uD560 JDBC \uB4DC\uB77C\uC774\uBC84\uB97C \uBA85\uC2DC.
# MySQL 8.0 \uC774\uC0C1\uC5D0\uC11C\uB294 \uAD6C\uD615(com.mysql.jdbc.Driver) \uB300\uC2E0 \uC2E0\uD615 \uB4DC\uB77C\uC774\uBC84 \uD074\uB798\uC2A4\uB97C \uC0AC\uC6A9\uD574\uC57C \uD568.
log4jdbc.driver.drivers=com.mysql.cj.jdbc.Driver

# \uCD9C\uB825\uB418\uB294 SQL \uBB38\uC7A5\uC758 \uCD5C\uB300 \uAE38\uC774\uB97C \uC124\uC815\uD569\uB2C8\uB2E4. (0\uC740 \uC81C\uD55C \uC5C6\uC74C\uC744 \uC758\uBBF8)
log4jdbc.dump.sql.maxlinelength=0

# \uC77C\uBC18\uC801\uC778 \uB4DC\uB77C\uC774\uBC84\uB4E4\uC744 \uC790\uB3D9\uC73C\uB85C \uB85C\uB4DC\uD560\uC9C0 \uC5EC\uBD80\uB97C \uC124\uC815\uD569\uB2C8\uB2E4.
# true\uC77C \uACBD\uC6B0 com.mysql.jdbc.Driver(Deprecated)\uB97C \uCC3E\uC73C\uB824\uB294 \uC2DC\uB3C4 \uB54C\uBB38\uC5D0 \uACBD\uACE0\uAC00 \uBC1C\uC0DD\uD560 \uC218 \uC788\uC5B4 false\uB85C \uC124\uC815\uD569\uB2C8\uB2E4.
log4jdbc.auto.load.popular.drivers=false
