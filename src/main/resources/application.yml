# server port setting
server:
  port: 8881

spring:


# application name setting
  application:
    name: sqld

# H2 Database Setting
  datasource:
    driver-class-name: org.h2.Driver
    url: jdbc:h2:tcp://localhost/~/test
    username: sa
    password: 1234

# H2 Console Setting
  h2:
    console:
      enabled: true

# Mybaties Setting
mybatis:
  mapper-locations: classpath:mapper/*.xml

# Swagger springdoc-ui Configuration
springdoc:
  packages-to-scan: com.sqld_board.sqld
  default-consumes-media-type: application/json;charset=UTF-8
  default-produces-media-type: application/json;charset=UTF-8
  cache:
    disabled: true  # 캐시 사용 여부
  api-docs:
    path: /api-docs/json
    groups:
      enabled: true
  swagger-ui:
    enabled: true            # Swagger UI 사용여부 : 접근 경로 => <http://localhost:8080/swagger-ui/index.html>
    path: /demo-ui.html      # Swagger UI 추가 접근 경로 => <http://localhost:8080/demo-ui.html>
    tags-sorter: alpha       # alpha: 알파벳 순 태그 정렬, method: HTTP Method 순 정렬
    operations-sorter: alpha # alpha: 알파벳 순 태그 정렬, method: HTTP Method 순 정렬


